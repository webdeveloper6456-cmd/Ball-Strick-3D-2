<script>
const $=id=>document.getElementById(id);
const SEG=12,S=Math.PI*2/SEG,H=0.62,T=0.42,R0=1.0,R1=3.0,BR=0.32,ORB=2.0;

let level=1,best=1,N=10,rings=[],k=0,y=0,vy=0,theta=0,score=0,combo=0,fire=false,fireT=0,hold=false,state='ready';
try{level=Math.max(1,parseInt(localStorage.getItem('sb_level'))||1);best=parseInt(localStorage.getItem('sb_best'))||level}catch(e){}
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(3,8,6);scene.add(dl);

addEventListener('resize',resize);resize();
// segment geometries
const geos=[];
for(let i=0;i<SEG;i++){const sh=new THREE.Shape(),n=6;
for(let j=0;j<=n;j++){const a=i*S+S*j/n;const p=[R1*Math.cos(a),-R1*Math.sin(a)];j?sh.lineTo(...p):sh.moveTo(...p)}

const g=new THREE.ExtrudeGeometry(sh,{depth:T,bevelEnabled:false});g.rotateX(-Math.PI/2);g.translate(0,-T,0);geos.push(g)}
const blackMat=new THREE.MeshLambertMaterial({color:0x1c1c24,emissive:0x40000c,flatShading:true}),goldMat=new THREE.MeshLambertMaterial({color:0xffc400,emissive:0x7a5200,flatShading:true}),bombMat=new THREE.MeshLambertMaterial({color:0xff2a2a,emissive:0xaa0000,flatShading:true});

scene.add(ball);
const flame=new THREE.Mesh(new THREE.ConeGeometry(.28,1.5,16,1,true),new THREE.MeshBasicMaterial({color:0x66aaff,transparent:true,opacity:.45,side:THREE.DoubleSide}));scene.add(flame);

function checker(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
for(let r=128;r>0;r-=16){x.fillStyle=(r/16)%2?'#00e5ff':'#7c4dff';x.beginPath();x.arc(128,128,r,0,7);x.fill()}
return new THREE.CanvasTexture(c)}
const ckTex=checker();
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function build(){
 while(tower.children.length)tower.remove(tower.children[0]);
 if(floorMesh){scene.remove(floorMesh)}
 const r=rng(level*7919+13),d=Math.min(level/30,1),d2=Math.max(0,Math.min((level-30)/120,1));
 N=Math.max(level*5,15);
 const hue=(level*47)%360;
 colMat=new THREE.MeshLambertMaterial({color:new THREE.Color(`hsl(${hue},85%,55%)`),emissive:new THREE.Color(`hsl(${hue},85%,22%)`),flatShading:true});
 applySkin(sel);
 document.body.style.background=`linear-gradient(hsl(${(hue+220)%360},60%,10%),hsl(${(hue+260)%360},65%,30%))`;
 rings=[];
 makeRing=(i)=>{
  const t=new Array(SEG).fill(0);
  if(i>0){
   const runs=r()<0.3+0.5*d+0.2*d2?1+(r()<d*.8?1:0)+(r()<d2?1:0)+(r()<d2*.7?1:0)+(r()<d2*.5?1:0):0;
   for(let q=0;q<runs;q++){const st=Math.floor(r()*SEG),len=1+Math.floor(r()*(2+3*d+4*d2));for(let j=0;j<len;j++)t[(st+j)%SEG]=1}
   if(r()<Math.max(.04,.5-.4*d-.1*d2)||(level<15&&i%5==0)){t[Math.floor(r()*SEG)]=2;if(r()<.5)t[(Math.floor(r()*SEG))]=2}
   if(t.filter(v=>v==0).length<2){const a=Math.floor(r()*SEG);t[a]=0;t[(a+1)%SEG]=0}
   if(r()<.14){const a=Math.floor(r()*SEG);if(t[a]==0)t[a]=3}
   if(level>=3&&r()<.09){const a=Math.floor(r()*SEG);if(t[a]==0)t[a]=4}
  }
  const g=new THREE.Group();g.position.y=-i*H;g.rotation.y=i*0.38;
  const meshes=[];
  t.forEach((v,j)=>{if(v==2)return;const m=new THREE.Mesh(geos[j],v==1?blackMat:v==3?goldMat:v==4?bombMat:colMat);g.add(m);meshes.push(m)});
  const sp=(r()<.5?-1:1)*(0.25+0.75*Math.min(level/20,1))*(0.4+r()*(0.7+1.3*d))*(1+1.6*d2);
  tower.add(g);return rings[i]={g,t,meshes,twist:i*0.38,spin:sp};
 }

 pole.scale.set(1,N*H+30,1);pole.position.y=fy+(N*H+30)/2;
 const top=new THREE.MeshLambertMaterial({map:ckTex}),wm=new THREE.MeshLambertMaterial({color:0xffffff});
 floorMesh=new THREE.Mesh(new THREE.CylinderGeometry(3.7,3.7,.8,40),[wm,top,wm]);
 floorMesh.position.y=fy-.4;scene.add(floorMesh);
 k=0;y=BR+2.5;vy=0;combo=0;fire=false;fireT=0;heat=0;score=0;theta=0;tower.rotation.y=0;

}
// audio
let ac;function beep(f,d,v=.1){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
// debris
const debris=[];
function shatter(ring){
 const phi=theta+ring.twist,cs=Math.cos(phi),sn=Math.sin(phi),chunks={};
 ring.meshes.forEach(m=>{const i=geos.indexOf(m.geometry);(chunks[i>>1]=chunks[i>>1]||[]).push([m,(i+.5)*S])});

const MONETAG_ZONE_ID = "YOUR_ZONE_ID";

// Interstitial ad (menu, retry — midgame)
function interstitial(cb){
  if(Date.now()-lastAd<120000){cb();return}
  adMuted=true;
  const done=()=>{adMuted=false;lastAd=Date.now();cb()};
  const adFn = window["show_"+MONETAG_ZONE_ID];
  if(typeof adFn === "function"){
    adFn().then(done).catch(done);
  } else {
    // SDK লোড হয়নি, বা ফাংশন নেই
    done();
  }
}

// Rewarded ad (revive, skip, unlock — user must watch to get reward)
function rewarded(cb){
  adMuted=true;
  const done=success=>{
    adMuted=false;lastAd=Date.now();
    if(success)cb();
    else toast('Ad not completed — no reward given.');
  };
  const adFn = window["show_"+MONETAG_ZONE_ID];
  if(typeof adFn === "function"){
    adFn().then((result)=>{
      // Monetag reward verification
      if(result && result.reward_event_type === 'valued'){
        done(true);
      } else {
        done(false);
      }
    }).catch(()=>done(false));
  } else {
    toast('Ad not available right now. Try again later.');
    done(false);
  }
}

  const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);
  mo=ac.createGain();mo.gain.value=.9;mo.connect(comp);mg=ac.createGain();mg.gain.value=.5;mg.connect(comp);
  const len=Math.floor(ac.sampleRate*.9),ib=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  rv=ac.createConvolver();rv.buffer=ib;const rg=ac.createGain();rg.gain.value=.22;rv.connect(rg);rg.connect(comp);
  nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const nd=nbuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  if(ac.state=='suspended')ac.resume();return true}catch(e){return false}}
function nzv(t,f0,f1,dur,vol,type='lowpass',q=1,out=mo,wet=0){const s=ac.createBufferSource();s.buffer=nbuf;s.loop=true;const f=ac.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.008,dur/4));g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(out);if(wet)g.connect(rv);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
function osv(t,f0,f1,dur,vol,type='sine',out=mo,wet=0){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(out);if(wet)g.connect(rv);o.start(t);o.stop(t+dur+.02)}
function sfx(k){if(adMuted||cgMute||!sndOn||!audioInit())return;const t=ac.currentTime+.005,r=Math.random;
 if(k=='crash'){if(t-lastCr<.085)return;lastCr=t;const p=1+Math.min(combo,20)*.015;
  nzv(t,2600*p,700,.06,.7,'bandpass',3.5,mo,1);nzv(t,1200*p,300,.16,.5,'bandpass',2);osv(t,220*p,110*p,.1,.5,'triangle');osv(t,90,50,.16,.4);
  for(let i=0;i<5;i++){const f=(900+r()*2200)*p;nzv(t+.02+i*.018+r()*.015,f*1.5,f,.03+r()*.03,.25,'bandpass',6,mo,1)}}
 else if(k=='bounce'){const p=.92+r()*.16;osv(t,340*p,95*p,.13,.5);nzv(t,1200,200,.05,.2);osv(t,60,45,.1,.35)}
 else if(k=='fire'){nzv(t,250,2800,.9,.55,'bandpass',.9,mo,1);osv(t,70,320,.9,.25,'sawtooth');for(let i=0;i<16;i++)nzv(t+.2+i*.11+r()*.05,3000+r()*3000,1500,.025,.12,'highpass')}
 else if(k=='die'){osv(t,380,55,.9,.35,'sawtooth',mo,1);nzv(t,900,60,.8,.5);osv(t,100,40,.35,.6);osv(t+.35,300,60,.7,.25,'square')}
 else if(k=='win'){[523.3,659.3,784,1046.5,1318.5].forEach((f,i)=>{osv(t+i*.1,f,f,.5,.22,'triangle',mo,1);osv(t+i*.1,f*2,f*2,.3,.06,'sine',mo,1)});nzv(t+.4,8000,6000,.5,.08,'highpass');for(let i=0;i<10;i++){const f=1800+r()*2500;osv(t+.5+i*.05,f,f,.15,.05,'sine',mo,1)}}

const ROOT=[110,87.31,130.81,98];
function musSched(){if(!ac||!mg||!musOn||adMuted||cgMute||document.hidden)return;if(musT<ac.currentTime)musT=ac.currentTime+.05;
 while(musT<ac.currentTime+.18){const s=musStep%16,bar=Math.floor(musStep/16)%4,rt=ROOT[bar],t=musT;
  if(s%4==0)osv(t,130,42,.16,.35,'sine',mg);
  if(s%2==1)nzv(t,9000,7000,.04,.07,'highpass',1,mg);
  if(s==4||s==12)nzv(t,2200,900,.13,.12,'bandpass',1,mg);
  if([0,3,6,8,11,14].includes(s))osv(t,rt,rt,.2,.2,'triangle',mg);
  const ar=[1,1.25,1.5,2][s%4]*(s>=8?1.5:1)*rt*2;osv(t,ar,ar,.11,.05,'square',mg);
